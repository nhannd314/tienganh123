<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/tokens/colors.css">
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/tokens/typography.css">
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/tokens/layout.css">
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/tokens/effects.css">
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/tokens/base.css">
  <link rel="stylesheet" href="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/styles.css">
  <script src="_ds/funenglish-design-system-41741dfb-b285-40a1-b85c-44b1e3e3a481/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}
    a{color:var(--text-link)} a:hover{color:var(--text-link-hover)}
    input::placeholder{color:var(--text-placeholder)}
  </style>
</helmet>

<main style="min-height:100vh;display:flex;background:var(--surface-page)">
  <section data-screen-label="Form" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-9) var(--space-5)">
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:var(--space-6)">
      <a href="Trang chu.dc.html" style="align-self:center;text-decoration:none;font:var(--fw-bold) var(--fs-3xl)/var(--lh-tight) var(--font-sans);color:var(--primary-text)">FunEnglish</a>

      <div style="background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-8) var(--space-7);display:flex;flex-direction:column;gap:var(--space-6)">
        <div style="display:flex;flex-direction:column;gap:var(--space-2);text-align:center">
          <h1 style="margin:0;font:var(--type-h1);color:var(--text-strong)">Đăng ký</h1>
          <p style="margin:0;font:var(--type-body);color:var(--text-muted);text-wrap:pretty">Tạo tài khoản để bắt đầu học tiếng Anh cùng FunEnglish nhé!</p>
        </div>

        <x-import component-from-global-scope="FunEnglishDesignSystem_41741d.Button" variant="outline" size="lg" full-width="{{ true }}" icon-left="{{ googleIcon }}" loading="{{ googleLoading }}" on-click="{{ onGoogle }}" hint-size="100%,56px">Đăng ký với Google</x-import>
        <div role="separator" style="display:flex;align-items:center;gap:var(--space-3);font:var(--type-body-sm);color:var(--text-muted)">
          <span style="flex:1;height:1px;background:var(--border-subtle)"></span>
          <span>hoặc đăng ký bằng email</span>
          <span style="flex:1;height:1px;background:var(--border-subtle)"></span>
        </div>

        <form onSubmit="{{ onSubmit }}" noValidate="{{ true }}" style="display:flex;flex-direction:column;gap:var(--space-5)">
          <x-import component-from-global-scope="FunEnglishDesignSystem_41741d.TextInput" label="Họ và tên" placeholder="Nguyễn Văn An" value="{{ name }}" on-change="{{ setName }}" state="{{ nameState }}" hint="{{ nameHint }}" hint-size="100%,84px"></x-import>
          <x-import component-from-global-scope="FunEnglishDesignSystem_41741d.TextInput" label="Email" placeholder="ten@email.com" value="{{ email }}" on-change="{{ setEmail }}" state="{{ emailState }}" hint="{{ emailHint }}" hint-size="100%,84px"></x-import>

          <div style="display:grid;gap:var(--space-2)">
            <label for="pw" style="font:var(--type-label);color:var(--text-body)">Mật khẩu</label>
            <div style="position:relative">
              <input id="pw" type="{{ pwType }}" value="{{ password }}" onChange="{{ onPw }}" placeholder="Ít nhất 6 ký tự" autoComplete="new-password" aria-invalid="{{ pwInvalid }}" aria-describedby="pw-hint" style="box-sizing:border-box;width:100%;height:var(--control-h-lg);padding:0 var(--space-10) 0 var(--space-4);border-radius:var(--radius-md);border:var(--border-width-thin) solid {{ pwBorder }};background:{{ pwBg }};outline:0;font:var(--fw-regular) var(--fs-xl)/var(--lh-snug) var(--font-sans);color:var(--text-strong);transition:var(--transition-interactive)" style-hover="border-color:var(--border-hover)" style-focus="box-shadow:var(--focus-ring)">
              <button type="button" onClick="{{ togglePw }}" aria-label="{{ pwToggleLabel }}" aria-pressed="{{ pwShown }}" style="position:absolute;right:var(--space-1);top:50%;transform:translateY(-50%);width:var(--control-h-md);height:var(--control-h-md);display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);cursor:pointer" style-hover="background:var(--primary-bg);color:var(--primary-text)">
                <x-import component-from-global-scope="FunEnglishDesignSystem_41741d.Icon" name="{{ pwIcon }}" size="md" hint-size="20px,20px"></x-import>
              </button>
            </div>
            <span id="pw-hint" style="font:var(--type-body-sm);color:{{ pwHintColor }}">{{ pwHint }}</span>
          </div>

          <div style="display:grid;gap:var(--space-2)">
            <label for="pw2" style="font:var(--type-label);color:var(--text-body)">Nhập lại mật khẩu</label>
            <input id="pw2" type="{{ pwType }}" value="{{ password2 }}" onChange="{{ onPw2 }}" placeholder="Nhập lại mật khẩu" autoComplete="new-password" aria-invalid="{{ pw2Invalid }}" style="box-sizing:border-box;width:100%;height:var(--control-h-lg);padding:0 var(--space-4);border-radius:var(--radius-md);border:var(--border-width-thin) solid {{ pw2Border }};background:{{ pw2Bg }};outline:0;font:var(--fw-regular) var(--fs-xl)/var(--lh-snug) var(--font-sans);color:var(--text-strong);transition:var(--transition-interactive)" style-hover="border-color:var(--border-hover)" style-focus="box-shadow:var(--focus-ring)">
            <sc-if value="{{ pw2Invalid }}" hint-placeholder-val="{{ false }}">
              <span style="font:var(--type-body-sm);color:var(--danger-text)">{{ pw2Hint }}</span>
            </sc-if>
          </div>

          <div style="display:grid;gap:var(--space-2)">
            <div style="display:flex;align-items:flex-start;gap:var(--space-3)">
              <x-import component-from-global-scope="FunEnglishDesignSystem_41741d.Checkbox" checked="{{ agree }}" on-change="{{ setAgree }}" label="Đồng ý với điều khoản sử dụng" hint-size="24px,24px"></x-import>
              <span style="font:var(--type-body);color:var(--text-body);text-wrap:pretty"><span onClick="{{ toggleAgree }}" style="cursor:pointer;user-select:none">Mình đồng ý với </span><a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a></span>
            </div>
            <sc-if value="{{ agreeInvalid }}" hint-placeholder-val="{{ false }}">
              <span style="font:var(--type-body-sm);color:var(--danger-text)">Bạn cần đồng ý với điều khoản để tiếp tục.</span>
            </sc-if>
          </div>

          <x-import component-from-global-scope="FunEnglishDesignSystem_41741d.Button" type="submit" variant="primary" size="lg" full-width="{{ true }}" loading="{{ loading }}" hint-size="100%,56px">Tạo tài khoản</x-import>
        </form>
      </div>

      <p style="margin:0;text-align:center;font:var(--type-body);color:var(--text-body)">Đã có tài khoản? <a href="Dang nhap.dc.html" style="font-weight:var(--fw-semibold)">Đăng nhập</a></p>
    </div>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: '', email: '', password: '', password2: '', pwShown: false, agree: false, tried: false, loading: false, googleLoading: false };
  componentWillUnmount() { clearTimeout(this.t); }
  go() { this.t = setTimeout(() => { window.location.href = 'Trang chu.dc.html'; }, 900); }
  renderVals() {
    const s = this.state;
    const nameOk = s.name.trim().length > 0;
    const emailOk = /^\S+@\S+\.\S+$/.test(s.email);
    const pwOk = s.password.length >= 6;
    const pw2Ok = !!s.password2 && s.password2 === s.password;
    const bad = { name: s.tried && !nameOk, email: s.tried && !emailOk, pw: s.tried && !pwOk, pw2: s.tried && !pw2Ok, agree: s.tried && !s.agree };
    const g = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>');
    const field = b => ({ border: b ? 'var(--danger-border)' : 'var(--border-default)', bg: b ? 'var(--danger-bg)' : 'var(--surface-card)' });
    return {
      googleIcon: React.createElement('img', { src: g, alt: '', width: 24, height: 24, style: { display: 'block' } }),
      googleLoading: s.googleLoading, loading: s.loading,
      onGoogle: () => { this.setState({ googleLoading: true }); this.go(); },
      name: s.name, setName: v => this.setState({ name: v }),
      nameState: bad.name ? 'wrong' : undefined, nameHint: bad.name ? 'Bạn chưa nhập họ và tên.' : undefined,
      email: s.email, setEmail: v => this.setState({ email: v }),
      emailState: bad.email ? 'wrong' : undefined,
      emailHint: bad.email ? (s.email ? 'Email chưa đúng định dạng, bạn kiểm tra lại nhé.' : 'Bạn chưa nhập email.') : undefined,
      password: s.password, onPw: e => this.setState({ password: e.target.value }),
      password2: s.password2, onPw2: e => this.setState({ password2: e.target.value }),
      pwType: s.pwShown ? 'text' : 'password', pwShown: s.pwShown,
      pwIcon: s.pwShown ? 'eye-off' : 'eye', pwToggleLabel: s.pwShown ? 'Ẩn mật khẩu' : 'Hiện mật khẩu',
      togglePw: () => this.setState(x => ({ pwShown: !x.pwShown })),
      pwInvalid: bad.pw, pwBorder: field(bad.pw).border, pwBg: field(bad.pw).bg,
      pwHint: bad.pw ? 'Mật khẩu cần có ít nhất 6 ký tự.' : 'Dùng ít nhất 6 ký tự.',
      pwHintColor: bad.pw ? 'var(--danger-text)' : 'var(--text-muted)',
      pw2Invalid: bad.pw2, pw2Border: field(bad.pw2).border, pw2Bg: field(bad.pw2).bg,
      pw2Hint: s.password2 ? 'Mật khẩu nhập lại chưa khớp.' : 'Bạn chưa nhập lại mật khẩu.',
      agree: s.agree, setAgree: v => this.setState({ agree: v }), toggleAgree: () => this.setState(x => ({ agree: !x.agree })),
      agreeInvalid: bad.agree,
      onSubmit: e => {
        e.preventDefault();
        if (!(nameOk && emailOk && pwOk && pw2Ok && s.agree)) { this.setState({ tried: true }); return; }
        this.setState({ tried: true, loading: true }); this.go();
      }
    };
  }
}
</script>
</body>
</html>
